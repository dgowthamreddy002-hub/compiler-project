<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Compiler AST</title><style>body{font:16px system-ui,sans-serif;max-width:900px;margin:40px auto;padding:0 20px;background:#f6f8fa;color:#17202a}h1{margin-bottom:4px}section{background:white;border:1px solid #d0d7de;border-radius:10px;padding:16px 22px;margin:20px 0}ul{list-style:none;border-left:2px solid #9aa4b2;margin:8px 0 0 12px;padding:0 0 0 20px}li{position:relative;margin:8px 0}li:before{content:'';position:absolute;left:-22px;top:.7em;width:14px;border-top:2px solid #9aa4b2}</style></head><body><h1>Compiler abstract syntax tree</h1><p>Generated from the parsed input. Parentheses are represented through tree grouping and are not separate AST nodes.</p><section><h2>Assignment</h2><ul><li>Assign</li><li>Identifier: n</li><li>Expression<ul><li>Binary '+'<ul><li>Number: 1</li><li>Number: 2</li></ul></li></ul></li></ul></section>
